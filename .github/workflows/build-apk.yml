name: Build Android APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Android Project & Build APK
        run: |
          echo "Scanning directory for Android build system..."
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in: $DIR"
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, searching for build.gradle..."
            BUILD_GRADLE=$(find . -name "build.gradle*" | head -n 1)
            if [ -n "$BUILD_GRADLE" ]; then
              DIR=$(dirname "$BUILD_GRADLE")
              echo "Found build.gradle in: $DIR"
              cd "$DIR"
              gradle assembleDebug --stacktrace
            else
              echo "Error: No Android Gradle project found!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: 'Android APK Release'
          files: '**/build/outputs/apk/debug/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
